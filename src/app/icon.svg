<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GovtJobs.pk">
  <defs>
    <linearGradient id="gj-bg" x1="0" y1="0" x2="0.18" y2="1">
      <stop offset="0%" stop-color="#066B50"/>
      <stop offset="55%" stop-color="#06523E"/>
      <stop offset="100%" stop-color="#033729"/>
    </linearGradient>
    <linearGradient id="gj-gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
  </defs>

  <!-- Institutional Deep Emerald Tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#gj-bg)"/>

  <!-- Subtle inner architectural rule for clean separation on dark and light tabs -->
  <rect x="14" y="14" width="484" height="484" rx="98" fill="none" stroke="#34D399" stroke-opacity="0.22" stroke-width="6"/>

  <g transform="translate(256, 256) scale(1) translate(-256, -256)">
    <!-- Custom Geometric 'G': smooth continuous oval contour into straight right stem + horizontal shelf -->
    <!-- Outer C-bowl centered at (172, 219), rx=76, ry=90 -->
    <!-- Starts upper-right at (232, 165), sweeps CCW over top, left, bottom to (246, 250), rises vertically to (246, 224), turns horizontally left to (174, 224) -->
    <path
      d="M 232 165
         A 76 90 0 1 0 245 256
         L 245 224
         L 172 224"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="46"
      stroke-linecap="butt"
      stroke-linejoin="miter"
    />

    <!-- Custom Geometric 'J': crisp architectural top bar + vertical stem + balanced bottom hook -->
    <path
      d="M 304 130 L 440 130"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="42"
      stroke-linecap="butt"
    />
    <path
      d="M 388 130
         L 388 250
         A 56 59 0 0 1 286 286"
      fill="none"
      stroke="#FFFFFF"
      stroke-width="46"
      stroke-linecap="butt"
    />

    <!-- Institutional Gold Prestige Bar -->
    <rect x="74" y="368" width="364" height="26" rx="8" fill="url(#gj-gold)"/>
  </g>
</svg>
